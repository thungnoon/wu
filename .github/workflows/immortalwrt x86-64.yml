name: immortalwrt_25.12_x86-64

on:
  push:
    branches: [ master ]
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 13 */5 * *'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  CONFIG_FILE: .config
  FEEDS_CONF: feeds.conf.default
  DIY1_SH: diy1.sh
  DIY2_SH: diy2.sh
  TZ: Asia/Shanghai
  OPENWRT_NAME: "ImmortalWrt"
  UPLOAD_RELEASE: true
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  CCACHE_DIR: ~/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    name: 编译任务
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 释放系统可用空间
        run: |
          sudo apt-get clean
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/share/swift /usr/share/miniconda /opt/microsoft /opt/google /var/lib/gems || true
          df -h

      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 设置时区与环境变量
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "date1=$(date +'%Y.%m.%d-%H.%M')" >> $GITHUB_ENV
          echo "date2=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib \
            git git-core gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz msmtp ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs unzip upx wget xmlto xxd zlib1g-dev

      - name: 克隆源码与初始化 Feeds
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          [ -f "../$FEEDS_CONF" ] && cp "../$FEEDS_CONF" ./
          [ -f "../$DIY1_SH" ] && chmod +x "../$DIY1_SH" && "../$DIY1_SH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 缓存 dl 目录与 ccache
        uses: actions/cache@v5
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: build-cache-${{ github.ref }}
          restore-keys: |
            build-cache-

      - name: 加载自定义配置与编译准备
        run: |
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          [ -f "../$DIY2_SH" ] && chmod +x "../$DIY2_SH" && "../$DIY2_SH"
          make defconfig

      - name: 下载源码包并编译
        id: compile
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} +
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 整理固件文件
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf *generic-squashfs-combined.img.gz
          rm -rf *.bin *.buildinfo *rootfs.* *.json *.manifest sha256sums packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件 Artifact
        uses: actions/upload-artifact@main
        if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: immortalWrt_firmware_${{ env.date1 }}
          path: ${{ env.FIRMWARE }}

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2.0.4
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.date1 }}_X86-64
          body: |
            X86-64 平台
            openwrt-25.12 源码
            默认 IP : 192.168.5.1
          files: ${{ env.FIRMWARE }}/*

      - name: 清理历史 Releases 与 Artifacts
        uses: ophub/delete-releases-workflows@main
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          delete_releases: true
          releases_keep_latest: 15
          delete_tags: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 删除无用 Artifacts
        uses: geekyeggo/delete-artifact@main
        with:
          name: bin-archive
