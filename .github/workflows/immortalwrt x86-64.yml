name: immortalwrt_25.12_x86-64

on:
  push:
    branches: [ master ]
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 3 */5 * *'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  CONFIG_FILE: .config
  FEEDS_CONF: feeds.conf.default
  DIY1_SH: diy1.sh
  DIY2_SH: diy2.sh
  TZ: Asia/Shanghai
  OPENWRT_NAME: "ImmortalWrt"
  UPLOAD_RELEASE: true
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  CCACHE_DIR: ~/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    name: 编译任务
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 释放系统可用空间
        run: |
          sudo apt-get clean
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/share/swift /usr/share/miniconda /opt/microsoft /opt/google /var/lib/gems || true
          df -h

      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 设置时区与环境变量
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "date1=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "date2=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib \
            git git-core gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz msmtp ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs unzip upx wget xmlto xxd zlib1g-dev

      - name: Clone source code & Update feeds
        run: |
          # 1. 自动获取 ImmortalWrt 25.12 系列最新的 Release Tag（如 v25.12.2）
          LATEST_TAG=$(git ls-remote --tags --refs $REPO_URL "v25.12*" | sort -t '/' -k3 -V | tail -n1 | awk -F/ '{print $3}')
          
          # 2. 如果没获取到 Tag，兜底使用全局定义的 REPO_BRANCH
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$REPO_BRANCH
          fi
          
          echo "=========================================="
          echo " 锁定拉取的最新稳定版 Tag: $LATEST_TAG"
          echo "=========================================="
          
          # 3. 精确锁定该 Tag 进行深度为 1 的克隆
          git clone --depth 1 --branch $LATEST_TAG $REPO_URL openwrt
          cd openwrt
          [ -f "../$FEEDS_CONF" ] && cp "../$FEEDS_CONF" ./
          ./scripts/feeds update -a
          [ -f "../$DIY1_SH" ] && chmod +x "../$DIY1_SH" && "../$DIY1_SH"
          ./scripts/feeds install -a
          
      - name: 缓存 dl 目录与 ccache
        uses: actions/cache@v5
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: build-cache-${{ github.ref }}
          restore-keys: |
            build-cache-

      - name: 加载自定义配置与编译准备
        run: |
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          [ -f "../$DIY2_SH" ] && chmod +x "../$DIY2_SH" && "../$DIY2_SH"
          make defconfig

      - name: 下载源码包并编译
        id: compile
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} +
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 整理固件文件
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf *generic-squashfs-combined.img.gz
          rm -rf *.bin *.buildinfo *rootfs.* *.json *.manifest sha256sums packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ImmortalWrt_X86_64
          path: ${{ env.FIRMWARE }}

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: X86_64_ImmortalWrt_25.12
          name: ImmortalWrt 25.12 x86_64 稳定精简版
          body: |
            平台架构：X86-64
            源码分支：ImmortalWrt 25.12 (最新 Release Tag)
            默认网关 IP：192.168.5.1
            集成特性：Docker (Dockerman) / eBPF / 纯净官方底座 (已剥离 docker-compose 编译项)
          files: ${{ env.FIRMWARE }}/*

      - name: 清理历史 Releases 与 Artifacts
        uses: ophub/delete-releases-workflows@main
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          delete_releases: true
          releases_keep_latest: 15
          delete_tags: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
